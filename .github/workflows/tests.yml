name: ASIT Skills-only contract tests
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Cancel obsolete PR checks, but retain every main-branch run.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Python static skill contracts
        run: python3 -m unittest discover -s plugin/tests -p 'test_*.py'
      - name: Validate packaged plugin
        run: python3 plugin/scripts/package.py --check
