name: ASIT Skills-only contract tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Python static skill contracts
        run: python3 -m unittest discover -s plugin/tests -p 'test_*.py'
      - name: Validate synthetic full-lesson blueprint fixture
        run: python3 plugin/scripts/lesson_contract.py plugin/tests/fixtures/valid_visual_lesson.json
      - name: Validate visual-symbol interactive fallback blueprint
        run: python3 plugin/scripts/lesson_contract.py plugin/tests/fixtures/valid_svg_fallback_lesson.json
      - name: Validate packaged plugin
        run: python3 plugin/scripts/package.py --check
