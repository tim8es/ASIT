name: ASIT Skills-only package
on:
  push:
    branches: [main]
    paths:
      - 'plugin/**'
      - '.github/workflows/plugin-package.yml'
  pull_request:
    paths:
      - 'plugin/**'
      - '.github/workflows/plugin-package.yml'
  workflow_dispatch:

concurrency:
  # Cancel obsolete PR checks, but retain every main-branch run.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate skill package
        run: python3 plugin/scripts/package.py --check
      - name: Build portable archive
        run: python3 plugin/scripts/package.py --output dist/ASIT_Skills_Plugin.zip
      - name: Upload for manually gated plugin release
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: asit-english-tutor-candidate
          path: dist/ASIT_Skills_Plugin.zip
          if-no-files-found: error
          retention-days: 7
