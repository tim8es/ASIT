name: ASIT Skills Plugin package

on:
  push:
    paths:
      - 'plugin/**'
      - '.github/workflows/plugin-package.yml'
  pull_request:
    paths:
      - 'plugin/**'
      - '.github/workflows/plugin-package.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate ASIT portable skills package
        run: python3 plugin/scripts/package.py --check
      - name: Build and verify portable ZIP
        run: python3 plugin/scripts/package.py --output dist/ASIT_Skills_Plugin_v0.2.3.zip
      - name: Prepare package source for release QA
        run: unzip -q dist/ASIT_Skills_Plugin_v0.2.3.zip -d artifact
      - name: Upload plugin source archive for manual release
        uses: actions/upload-artifact@v4
        with:
          name: asit-english-tutor-v0.2.3
          path: artifact/asit-english-tutor/
          if-no-files-found: error
          retention-days: 7
